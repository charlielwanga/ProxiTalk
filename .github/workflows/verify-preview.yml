name: Verify ProxiTalk preview

on:
  push:
    branches:
      - main
      - arena/306f28c7-proxitalk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:android
      - run: npm test
